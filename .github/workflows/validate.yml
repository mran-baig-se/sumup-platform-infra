name: Validate

on:
  push:
    branches: [master]
    paths:
      - 'teams/**'
      - 'modules/**'
      - 'platform/**'
  pull_request:
    paths:
      - 'teams/**'
      - 'modules/**'
      - 'platform/**'
  workflow_dispatch:

jobs:
  validate:
    name: Terraform validate + lint + security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate module
        run: |
          terraform -chdir=./modules/team-resources init -backend=false
          terraform -chdir=./modules/team-resources validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Run tflint
        run: tflint --recursive

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: modules/
          framework: terraform
          quiet: true
          soft_fail: true

      - name: Validate team YAML schemas
        run: |
          python3 - <<'PYEOF'
          import yaml, sys, os, re
          errors = []
          teams_dir = "teams"
          for fname in os.listdir(teams_dir):
              if not fname.endswith(".yaml"):
                  continue
              with open(os.path.join(teams_dir, fname)) as f:
                  config = yaml.safe_load(f)
              team = config.get("team_name", "")
              if not re.match(r'^[a-z][a-z0-9-]{2,29}$', team):
                  errors.append(f"{fname}: invalid team_name")
              for b in config.get("buckets", []):
                  if b.get("visibility") not in ("public", "private"):
                      errors.append(f"{fname}: invalid visibility")
          if errors:
              for e in errors: print(f"  x {e}")
              sys.exit(1)
          else:
              print("All YAML files valid")
          PYEOF
